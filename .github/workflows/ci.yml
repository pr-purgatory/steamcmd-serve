name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Release tag script tests
        run: .github/scripts/release-tag_test.sh

  api:
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@2 lint api/openapi.yaml

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
      - name: Install dependencies
        if: hashFiles('web/package.json') != ''
        run: npm ci
        working-directory: web
      - name: Build
        if: hashFiles('web/package.json') != ''
        run: npm run build
        working-directory: web

  integration:
    name: Integration and image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build fake runtime image
        run: docker build -t localhost/steamcmd-serve-fake-runtime:test internal/instance/testdata/fake-runtime
      - name: Integration tests
        env:
          SS_IT_IMAGE: localhost/steamcmd-serve-fake-runtime:test
          SS_IT_DATA_DIR: ${{ runner.temp }}/it
        run: go test -count=1 -run Integration -v ./internal/instance/
      - name: Controller image smoke build (no push)
        run: docker build -f images/controller/Dockerfile .
