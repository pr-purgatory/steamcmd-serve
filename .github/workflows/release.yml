name: Release

# Run from the Actions tab ("Run workflow") to tag the selected commit and release it.
# Pushing a tag by hand (v1.2.3 or 2026.10.22-style) releases that tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom release tag (defaults to CalVer YYYY.MM.DD[.N])'
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"

permissions:
  contents: read

# One release at a time, so two runs on the same day cannot pick the same CalVer tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Choose tag
        id: tag
        env:
          CUSTOM_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(git tag --list | .github/scripts/release-tag.sh "$CUSTOM_TAG")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  runtime-images:
    name: Runtime images (amd64)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      OWNER: ${{ needs.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (steamcmd-base)
        id: meta-base
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/steamcmd-base
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build and push steamcmd-base
        uses: docker/build-push-action@v7
        with:
          context: images/steamcmd-base
          file: images/steamcmd-base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=steamcmd-base
          cache-to: type=gha,mode=max,scope=steamcmd-base
      - name: Metadata (steamcmd-wine)
        id: meta-wine
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/steamcmd-wine
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build and push steamcmd-wine
        uses: docker/build-push-action@v7
        with:
          context: images/steamcmd-wine
          file: images/steamcmd-wine/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.OWNER }}/steamcmd-base:${{ env.TAG }}
          tags: ${{ steps.meta-wine.outputs.tags }}
          labels: ${{ steps.meta-wine.outputs.labels }}
          cache-from: type=gha,scope=steamcmd-wine
          cache-to: type=gha,mode=max,scope=steamcmd-wine

  controller:
    name: Controller image (amd64, arm64)
    needs: [version, runtime-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      OWNER: ${{ needs.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (controller)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/steamcmd-serve
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build and push controller
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The controller pulls runtime images of its own release tag.
          build-args: |
            IMAGE_REPO=ghcr.io/${{ env.OWNER }}
            VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

  desktop-client:
    name: Desktop client (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      WAILS_VERSION: v2.17.0
      ARCHIVE: steamcmd-serve-client-${{ needs.version.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            goos: darwin
            goarch: universal
            ext: zip
          - os: windows-latest
            target: windows/amd64
            goos: windows
            goarch: amd64
            ext: zip
          - os: ubuntu-22.04
            target: linux/amd64
            goos: linux
            goarch: amd64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build
        working-directory: client
        run: wails build -clean -platform ${{ matrix.target }}
      - name: Archive (zip, macOS)
        if: runner.os == 'macOS'
        working-directory: client/build/bin
        run: ditto -c -k --sequesterRsrc --keepParent steamcmd-serve.app "$ARCHIVE.zip"
      - name: Archive (zip, Windows)
        if: runner.os == 'Windows'
        working-directory: client/build/bin
        shell: pwsh
        run: Compress-Archive -Path steamcmd-serve-client.exe -DestinationPath "$env:ARCHIVE.zip"
      - name: Archive (tar.gz, Linux)
        if: runner.os == 'Linux'
        working-directory: client/build/bin
        run: tar -czf "$ARCHIVE.tar.gz" steamcmd-serve-client
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: client/build/bin/${{ env.ARCHIVE }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [version, runtime-images, controller, desktop-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Images: `ghcr.io/${{ needs.version.outputs.owner }}/steamcmd-serve:${{ needs.version.outputs.tag }}` (controller, amd64/arm64), `steamcmd-base` and `steamcmd-wine` (amd64) with the same tag.
            Desktop builds are unsigned; see docs/desktop-client.md.
