name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  runtime-images:
    name: Runtime images (amd64)
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (steamcmd-base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/steamcmd-base
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push steamcmd-base
        uses: docker/build-push-action@v6
        with:
          context: images/steamcmd-base
          file: images/steamcmd-base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=steamcmd-base
          cache-to: type=gha,mode=max,scope=steamcmd-base
      - name: Metadata (steamcmd-wine)
        id: meta-wine
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/steamcmd-wine
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push steamcmd-wine
        uses: docker/build-push-action@v6
        with:
          context: images/steamcmd-wine
          file: images/steamcmd-wine/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.owner.outputs.owner }}/steamcmd-base:${{ steps.meta-base.outputs.version }}
          tags: ${{ steps.meta-wine.outputs.tags }}
          labels: ${{ steps.meta-wine.outputs.labels }}
          cache-from: type=gha,scope=steamcmd-wine
          cache-to: type=gha,mode=max,scope=steamcmd-wine

  controller:
    name: Controller image (amd64, arm64)
    needs: runtime-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (controller)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.runtime-images.outputs.owner }}/steamcmd-serve
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/controller/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMAGE_REPO=ghcr.io/${{ needs.runtime-images.outputs.owner }}
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

  desktop-client:
    name: Desktop client (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      WAILS_VERSION: v2.17.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            goos: darwin
            goarch: universal
            ext: zip
          - os: windows-latest
            target: windows/amd64
            goos: windows
            goarch: amd64
            ext: zip
          - os: ubuntu-22.04
            target: linux/amd64
            goos: linux
            goarch: amd64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build
        working-directory: client
        run: wails build -clean -platform ${{ matrix.target }}
      - name: Archive (zip, macOS)
        if: runner.os == 'macOS'
        working-directory: client/build/bin
        env:
          ARCHIVE: steamcmd-serve-client-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: ditto -c -k --sequesterRsrc --keepParent steamcmd-serve.app "$ARCHIVE.zip"
      - name: Archive (zip, Windows)
        if: runner.os == 'Windows'
        working-directory: client/build/bin
        shell: pwsh
        env:
          ARCHIVE: steamcmd-serve-client-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: Compress-Archive -Path steamcmd-serve-client.exe -DestinationPath "$env:ARCHIVE.zip"
      - name: Archive (tar.gz, Linux)
        if: runner.os == 'Linux'
        working-directory: client/build/bin
        env:
          ARCHIVE: steamcmd-serve-client-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: tar -czf "$ARCHIVE.tar.gz" steamcmd-serve-client
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/build/bin/steamcmd-serve-client-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}
